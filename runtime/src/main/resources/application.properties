quarkus.application.name=casehub-clinical

# ============================================================
# Default datasource — clinical domain + casehub-work tables
# Flyway location: clinical-specific migrations only (db/migration/default/).
# casehub-work migrations (V1–V21) are in classpath:db/migration but must NOT
# be scanned here — qhorus V1–V9 are also in classpath:db/migration and conflict.
# In production, casehub-work schema is pre-provisioned by infrastructure.
# ============================================================
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.packages=io.casehub.work.runtime,io.casehub.clinical.entity,io.casehub.platform.memory.jpa,io.casehub.neocortex.memory.jpa
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.locations=db/migration/default,classpath:db/memory/migration
quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:clinical;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.flyway.migrate-at-start=false

# ============================================================
# Qhorus named datasource — qhorus + casehub-ledger tables
# Platform convention: ledger always shares the qhorus PU.
# Flyway: qhorus jar migrations (classpath:db/migration) + clinical ledger migrations.
# ============================================================
quarkus.datasource.qhorus.db-kind=postgresql
quarkus.hibernate-orm.qhorus.datasource=qhorus
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.ledger.model,io.casehub.clinical.ledger
quarkus.hibernate-orm.qhorus.schema-management.strategy=validate
quarkus.flyway.qhorus.locations=classpath:db/migration,classpath:db/migration/qhorus,classpath:db/engine-ledger/migration,classpath:db/ledger/migration
quarkus.flyway.qhorus.migrate-at-start=true

%dev.quarkus.datasource.qhorus.db-kind=h2
%dev.quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.qhorus.username=sa
%dev.quarkus.datasource.qhorus.password=
%dev.quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
%dev.quarkus.flyway.qhorus.migrate-at-start=false

# Dev Quartz — RAM store (no DB tables), forced start
%dev.quarkus.quartz.store-type=ram
%dev.quarkus.scheduler.start-mode=forced

# Direct casehub-ledger to the qhorus persistence unit
casehub.ledger.datasource=qhorus
# Enable actorId tokenisation — required for LedgerErasureService.erase() to pseudonymize
# actorId fields on consent withdrawal (GDPR Art.17). Without this flag,
# InternalActorIdentityProvider is inactive and erase() is a no-op.
casehub.ledger.identity.tokenisation.enabled=true
%dev.casehub.ledger.identity.tokenisation.enabled=false

# Enable erasure receipts — LedgerErasureService writes ErasureReceiptLedgerEntry on each
# erase() call. The receipt is a merkle-linked audit record of what was erased.
casehub.ledger.erasure-receipt.enabled=true

# Select ALL @Alternative stores — both JPA and memory (blocking + reactive).
# Profile-specific exclude-types controls which survive in each environment:
#   dev:  exclude-types removes JPA beans (blocking + reactive) → memory stores win
#   prod: exclude-types removes memory beans → JPA stores win
#   test: test application.properties has its own selected-alternatives (takes precedence)
quarkus.arc.selected-alternatives=\
  io.casehub.ledger.runtime.repository.jpa.JpaLedgerEntryRepository,\
  io.casehub.persistence.jpa.JpaPlanItemStore,\
  io.casehub.persistence.jpa.JpaSubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryPlanItemStore,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryReactiveEventLogRepository,\
  io.casehub.persistence.memory.InMemoryReactivePlanItemStore,\
  io.casehub.persistence.memory.InMemoryReactiveSubCaseGroupRepository,\
  io.casehub.neocortex.memory.cbr.inmem.InMemoryCbrCaseMemoryStore

# ── CaseMemoryStore — JPA adapter CDI wiring (production) ─────────────────────
# casehub-platform-memory-jpa lacks Jandex index (no quarkus:build goal) — force scanning.
# JpaMemoryStore @ApplicationScoped displaces NoOpCaseMemoryStore @DefaultBean by classpath presence.
# No selected-alternatives entry needed for production — displacement is automatic.
%prod.quarkus.index-dependency.memory-jpa.group-id=io.casehub
%prod.quarkus.index-dependency.memory-jpa.artifact-id=casehub-platform-memory-jpa

# casehub-engine and casehub-engine-common lack Jandex indices — force discovery.
# JQEvaluator (@ApplicationScoped) lives in engine-common; EventLogRepository
# implementations live in casehub-engine. Without indexing these jars, CDI startup fails.
%prod.quarkus.index-dependency.casehub-engine.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine.artifact-id=casehub-engine
%prod.quarkus.index-dependency.casehub-engine-common.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine-common.artifact-id=casehub-engine-common
%prod.quarkus.index-dependency.casehub-engine-persistence-hibernate.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine-persistence-hibernate.artifact-id=casehub-engine-persistence-hibernate
%prod.quarkus.index-dependency.neocortex-cbr-inmem.group-id=io.casehub
%prod.quarkus.index-dependency.neocortex-cbr-inmem.artifact-id=casehub-neocortex-memory-cbr-inmem
%prod.quarkus.index-dependency.work-core.group-id=io.casehub
%prod.quarkus.index-dependency.work-core.artifact-id=casehub-work-core

# Dev — index JARs without embedded Jandex. JARs WITH Jandex (engine, engine-common,
# engine-persistence-hibernate, engine-persistence-memory, engine-blackboard, engine-work-adapter,
# engine-ledger, casehub-work, casehub-platform, casehub-platform-oidc) are auto-discovered.
# casehub-work-core: has Jandex but ContinuationPolicy (ClaimSlaPolicy) was not discovered
# without explicit indexing — force-index as belt-and-suspenders.
%dev.quarkus.index-dependency.memory-jpa.group-id=io.casehub
%dev.quarkus.index-dependency.memory-jpa.artifact-id=casehub-platform-memory-jpa
%dev.quarkus.index-dependency.work-core.group-id=io.casehub
%dev.quarkus.index-dependency.work-core.artifact-id=casehub-work-core
%dev.quarkus.index-dependency.neocortex-cbr-inmem.group-id=io.casehub
%dev.quarkus.index-dependency.neocortex-cbr-inmem.artifact-id=casehub-neocortex-memory-cbr-inmem

# Prod — exclude memory blocking stores; keep memory reactive stores as fallback
# (engine requires reactive SPIs; reactive=false means JPA reactive stores are inactive).
# When prod enables reactive=true, swap: exclude memory reactive, keep JPA reactive.
# QhorusDashboardService excluded: injects @Vetoed reactive services unconditionally (qhorus bug).
%prod.quarkus.arc.exclude-types=\
  io.casehub.persistence.memory.InMemoryPlanItemStore,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactiveCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaReactiveCaseMetaModelRepository,\
  io.casehub.persistence.jpa.JpaReactiveCrossTenantCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaReactiveCrossTenantEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactiveEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactivePlanItemStore,\
  io.casehub.persistence.jpa.JpaReactiveSubCaseGroupRepository,\
  io.casehub.qhorus.runtime.channel.ClockProducer,\
  io.casehub.qhorus.runtime.dashboard.QhorusDashboardService

# XA is required when a single transaction writes to both datasources (default + qhorus).
# ProtocolDeviationService, DeviationExpirer, and AdverseEventService all do this.
quarkus.datasource.jdbc.transactions=xa
quarkus.datasource.qhorus.jdbc.transactions=xa

# Reactive suppression — both datasources are JDBC-only. Engine reactive SPIs
# are satisfied by InMemoryReactive* stores (dev/test) or JpaReactive* with a
# real reactive driver (prod). Without reactive=false, qhorus reactive services
# (ReactiveMessageStore etc.) fail CDI validation.
quarkus.datasource.reactive=false
quarkus.datasource.qhorus.reactive=false

# ============================================================
# OIDC — casehub-platform-oidc (clinical#88)
# Required env vars (do NOT hardcode values):
#   QUARKUS_OIDC_AUTH_SERVER_URL   e.g. https://auth.example.com/realms/casehub
#   QUARKUS_OIDC_CLIENT_ID         e.g. casehub-clinical
# ============================================================
quarkus.oidc.application-type=service

# Deny unannotated members — any new method on a class with existing @RolesAllowed
# annotations fails closed. Does NOT cover entirely new resource classes with zero
# annotations (DenyUnannotatedPredicate requires at least one annotated method).
quarkus.security.deny-unannotated-members=true

# Dev profile — disable OIDC and security enforcement.
# GE-20260622-580d45: auth.enabled-in-dev-mode=false suppresses @RolesAllowed + deny-unannotated-members.
%dev.quarkus.security.auth.enabled-in-dev-mode=false
%dev.quarkus.oidc.enabled=false
%dev.quarkus.keycloak.devservices.enabled=false
# OidcCurrentPrincipal injects JsonWebToken — ArC validates all injection points
# even for non-selected @Alternative beans. With OIDC disabled, JsonWebToken is
# absent → CDI deployment fails. Exclude the class in dev mode;
# DemoCurrentPrincipal @Alternative @Priority(150) @IfBuildProfile("dev") provides identity.
%dev.quarkus.arc.exclude-types=io.casehub.platform.oidc.OidcCurrentPrincipal,\
  io.casehub.connectors.twilio.TwilioSmsConnector,\
  io.casehub.connectors.whatsapp.WhatsAppConnector,\
  io.casehub.work.runtime.service.ExpiryLifecycleService,\
  io.casehub.work.runtime.service.ExpiryCleanupJob,\
  io.casehub.work.runtime.service.ExpiryTimerJob,\
  io.casehub.work.runtime.service.ClaimDeadlineJob,\
  io.casehub.work.runtime.service.ClaimDeadlineTimerJob,\
  io.casehub.work.runtime.strategy.RoutingCursorCleanupJob,\
  io.casehub.clinical.service.SponsorNotificationRetryJob,\
  io.casehub.persistence.jpa.AbstractJpaRepository,\
  io.casehub.persistence.jpa.TenantAwareRepository,\
  io.casehub.persistence.jpa.JpaCaseMetaModelRepository,\
  io.casehub.persistence.jpa.JpaCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaPlanItemStore,\
  io.casehub.persistence.jpa.JpaSubCaseGroupRepository,\
  io.casehub.persistence.jpa.JpaEventLogRepository,\
  io.casehub.persistence.jpa.JpaCrossTenantCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaCrossTenantEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactiveCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaReactiveCaseMetaModelRepository,\
  io.casehub.persistence.jpa.JpaReactiveCrossTenantCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaReactiveCrossTenantEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactiveEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactivePlanItemStore,\
  io.casehub.persistence.jpa.JpaReactiveSubCaseGroupRepository,\
  io.casehub.persistence.jpa.RlsPolicyApplicator,\
  io.casehub.qhorus.runtime.channel.ClockProducer,\
  io.casehub.qhorus.runtime.dashboard.QhorusDashboardService

# ── Quinoa — hosts webui/ dist at / ──
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-command=yarn
quarkus.quinoa.package-manager-install.install-command=install
quarkus.quinoa.enable-spa-routing=true

# ── CBR trust weighting ──
casehub.cbr.trust-weighting.enabled=true
casehub.cbr.trust-weighting.influence=0.3

# ── Demo data (dev profile only) ──
%dev.casehub.clinical.demo.seed-data=true
casehub.clinical.demo.seed-data=false

# ── CBR scope decay ──
casehub.clinical.cbr.scope-decay.ae=exponential:0.7
casehub.clinical.cbr.scope-decay.deviation=exponential:0.8
casehub.clinical.cbr.scope-decay.amendment=step:1.0
casehub.clinical.cbr.scope-decay.site-enrollment=exponential:0.7
casehub.clinical.cbr.scope-decay.trial-safety=step:1.0

# ── CBR temporal decay ──
casehub.clinical.cbr.temporal-decay.ae=halflife:90d
casehub.clinical.cbr.temporal-decay.ae-trajectory=halflife:60d
casehub.clinical.cbr.temporal-decay.deviation=halflife:180d
casehub.clinical.cbr.temporal-decay.amendment=halflife:365d
casehub.clinical.cbr.temporal-decay.site-enrollment=halflife:60d
casehub.clinical.cbr.temporal-decay.trial-safety=halflife:90d

# CBR retention purge
casehub.clinical.cbr.retention.ae.max-age-days=730
casehub.clinical.cbr.retention.ae.max-cases=10000
casehub.clinical.cbr.retention.ae-trajectory.max-age-days=365
casehub.clinical.cbr.retention.trial-safety.max-age-days=365

casehub.clinical.dsmb.batch-signal.sla=PT72H
casehub.clinical.dsmb.batch-signal.expiry=P14D
casehub.clinical.dsmb.batch-signal.connector-id=slack
casehub.clinical.dsmb.batch-signal.notification-channel=dsmb

casehub.clinical.cbr.compaction.enabled=false
casehub.clinical.cbr.compaction.interval=168h
casehub.clinical.cbr.compaction.min-group-size=3
