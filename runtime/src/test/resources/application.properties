quarkus.http.test-port=0
quarkus.scheduler.enabled=false

# ============================================================
# Default datasource — clinical domain + casehub-work tables
# Tests use drop-and-create; Flyway disabled to avoid classpath migration conflicts
# (qhorus V1–V9 and casehub-work V1–V21 both live at classpath:db/migration).
# ============================================================
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:clinical;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.transactions=xa
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.packages=io.casehub.work.runtime,io.casehub.clinical.entity
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration/default

# ============================================================
# Qhorus named datasource — qhorus + casehub-ledger tables
# ============================================================
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.qhorus.jdbc.transactions=xa
quarkus.datasource.qhorus.username=sa
quarkus.datasource.qhorus.password=
quarkus.hibernate-orm.qhorus.datasource=qhorus
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.ledger.model,io.casehub.clinical.ledger
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.flyway.qhorus.migrate-at-start=false
quarkus.flyway.qhorus.locations=db/migration/qhorus

casehub.ledger.datasource=qhorus

# In tests: use memory stores for engine PlanItem and SubCaseGroup persistence.
quarkus.arc.selected-alternatives=io.casehub.ledger.runtime.repository.jpa.JpaLedgerEntryRepository,\
  io.casehub.persistence.memory.MemoryPlanItemStore,\
  io.casehub.persistence.memory.MemorySubCaseGroupRepository

# ============================================================
# Reactive suppression — JDBC-only test environment; standard Quarkus datasource
# reactive flag disabled to avoid "reactive datasource required" startup failures.
# Note: casehub.qhorus.reactive.enabled was removed from qhorus config model.
# ============================================================
quarkus.datasource.reactive=false
quarkus.datasource.qhorus.reactive=false

# ============================================================
# Connector exclusions — Twilio and WhatsApp require external config not present in tests.
# SlackConnector is replaced by TestSlackConnector via @Mock.
# TeamsConnector has no required config and can remain active.
# ============================================================
# JpaWorkloadProvider excluded — engine provides its own bridge; the work-module provider
# creates CDI ambiguity when both are on the classpath.
#
# Engine bean exclusions — engine jars self-index via embedded application.properties,
# discovering beans that require casehub-platform-expression and casehub-platform (not on
# test classpath). These beans are excluded here; integration tests that need engine beans
# use @QuarkusTestProfile with additional dependencies.
#
# ExpiryLifecycleService, ExpiryCleanupJob, ClaimDeadlineJob — inject PreferenceProvider
# (casehub-platform not on test classpath). Excluded as scheduler is disabled in tests.
quarkus.arc.exclude-types=io.casehub.connectors.twilio.TwilioSmsConnector,\
  io.casehub.connectors.whatsapp.WhatsAppConnector,\
  io.casehub.work.runtime.service.JpaWorkloadProvider,\
  io.casehub.work.runtime.service.ExpiryLifecycleService,\
  io.casehub.work.runtime.service.ExpiryCleanupJob,\
  io.casehub.work.runtime.service.ClaimDeadlineJob,\
  io.casehub.engine.internal.orchestration.WorkOrchestrator,\
  io.casehub.engine.scheduler.quartz.QuartzWorkerExecutionJob,\
  io.casehub.engine.scheduler.quartz.QuartzWorkerSchedulerService,\
  io.casehub.engine.scheduler.quartz.QuartzWorkerExecutionManager,\
  io.casehub.engine.scheduler.quartz.QuartzWorkerExecutionJobListener,\
  io.casehub.engine.scheduler.quartz.QuartzJobScheduler,\
  io.casehub.engine.scheduler.quartz.ConditionalScheduledTriggerJob,\
  io.casehub.engine.scheduler.quartz.ScheduledTriggerJob,\
  io.casehub.engine.internal.engine.handler.CaseContextChangedEventHandler,\
  io.casehub.engine.internal.engine.handler.WorkerScheduleEventHandler,\
  io.casehub.engine.internal.engine.handler.MilestoneCompletedEventHandler,\
  io.casehub.engine.internal.engine.handler.MilestoneActivatedEventHandler,\
  io.casehub.engine.internal.engine.handler.CaseStartedEventHandler,\
  io.casehub.engine.internal.engine.handler.CaseStatusChangedHandler,\
  io.casehub.engine.internal.engine.handler.SignalReceivedEventHandler,\
  io.casehub.engine.internal.scheduler.SchedulerService,\
  io.casehub.engine.internal.worker.CasehubWorkloadProvider,\
  io.casehub.engine.internal.engine.recovery.DefaultWorkerExecutionRecoveryService,\
  io.casehub.blackboard.subcase.SubCaseCompletionService,\
  io.casehub.blackboard.subcase.SubCaseCompletionListener,\
  io.casehub.workadapter.WorkItemLifecycleAdapter

# ============================================================
# Engine — external jar indexing (beans not auto-discovered without quarkus.index-dependency)
# ============================================================
# NOTE: engine-scheduler-quartz, engine-work-adapter, engine-blackboard are NOT indexed
# because indexing them causes CDI failures (beans require casehub-platform-expression
# and casehub-engine-common which are not on the test classpath).
# Integration tests that need these beans use @QuarkusTestProfile with the full engine stack.
quarkus.index-dependency.engine-testing.group-id=io.casehub
quarkus.index-dependency.engine-testing.artifact-id=casehub-engine-testing
quarkus.index-dependency.engine-persistence-memory.group-id=io.casehub
quarkus.index-dependency.engine-persistence-memory.artifact-id=casehub-engine-persistence-memory
# casehub-engine-common provides io.casehub.engine.internal.jq.JQEvaluator (needed by JQExpressionEngine)
# and SecretManager/ConfigManager interfaces (implemented by casehub-engine's QuarkusConfigManager).
quarkus.index-dependency.engine-common.group-id=io.casehub
quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
