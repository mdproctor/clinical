quarkus.index-dependency.memory-inmem.artifact-id=casehub-platform-memory-inmem
quarkus.index-dependency.memory-jpa.group-id=io.casehub
quarkus.index-dependency.memory-jpa.artifact-id=casehub-platform-memory-jpa
quarkus.index-dependency.engine-ledger.group-id=io.casehub
quarkus.index-dependency.engine-ledger.artifact-id=casehub-engine-ledger
quarkus.index-dependency.work-core.group-id=io.casehub
quarkus.index-dependency.work-core.artifact-id=casehub-work-core
