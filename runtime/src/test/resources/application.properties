quarkus.http.test-port=0
casehub.signal.api-url=http://localhost:8080
casehub.signal.number=+10000000000

casehub.clinical.dsmb.batch-signal.sla=PT72H
casehub.clinical.dsmb.batch-signal.expiry=P14D
casehub.clinical.dsmb.batch-signal.connector-id=slack
casehub.clinical.dsmb.batch-signal.notification-channel=test-dsmb
casehub.clinical.trial-safety.interval=9999h
# Quartz RAM store — no JDBC tables needed in tests
quarkus.quartz.store-type=ram
# Force scheduler start even with no @Scheduled methods (engine capability workers are not needed in tests)
quarkus.scheduler.start-mode=forced

# ============================================================
# Default datasource — clinical domain + casehub-work tables
# Tests use drop-and-create; Flyway disabled to avoid classpath migration conflicts
# (qhorus V1–V9 and casehub-work V1–V21 both live at classpath:db/migration).
# ============================================================
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:clinical;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.transactions=xa
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.packages=io.casehub.work.runtime,io.casehub.clinical.entity,io.casehub.platform.memory.jpa,io.casehub.work.engine
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration/default

# ============================================================
# Qhorus named datasource — qhorus + casehub-ledger tables
# ============================================================
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.qhorus.jdbc.transactions=xa
quarkus.datasource.qhorus.username=sa
quarkus.datasource.qhorus.password=
quarkus.hibernate-orm.qhorus.datasource=qhorus
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.ledger.model,io.casehub.clinical.ledger
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.flyway.qhorus.migrate-at-start=false
quarkus.flyway.qhorus.locations=db/migration/qhorus,classpath:db/engine-ledger/migration

casehub.ledger.datasource=qhorus
# tokenisation disabled in tests — enables raw actorId assertions in PiResponseListenerTest etc.
# ConsentWithdrawalServiceTest does not assert on ledgerEntriesAffected so does not need it.
casehub.ledger.identity.tokenisation.enabled=false
# Enable erasure receipts — LedgerErasureService writes ErasureReceiptLedgerEntry on each
# erase() call. The receipt is a merkle-linked audit record of what was erased.
casehub.ledger.erasure-receipt.enabled=true

# ============================================================
# Reactive suppression — JDBC-only test environment; standard Quarkus datasource
# reactive flag disabled to avoid "reactive datasource required" startup failures.
# Note: casehub.qhorus.reactive.enabled was removed from qhorus config model.
# ============================================================
quarkus.datasource.reactive=false
quarkus.datasource.qhorus.reactive=false

# ============================================================
# CDI — engine integration (matches devtown test configuration)
# JpaWorkloadProvider excluded — StubWorkloadProvider (@DefaultBean) in test/support/
# provides the zero-returning bridge. CasehubWorkloadProvider was deleted in engine#378;
# clinical#41 added StubWorkloadProvider so @QuarkusTest CDI startup is engine-independent.
# ============================================================
quarkus.arc.exclude-types=io.casehub.connectors.twilio.TwilioSmsConnector,\
  io.casehub.connectors.whatsapp.WhatsAppConnector,\
  io.casehub.work.runtime.service.JpaWorkloadProvider,\
  io.casehub.work.runtime.service.ExpiryLifecycleService,\
  io.casehub.work.runtime.service.ExpiryCleanupJob,\
  io.casehub.work.runtime.service.ExpiryTimerJob,\
  io.casehub.work.runtime.service.ClaimDeadlineJob,\
  io.casehub.work.runtime.service.ClaimDeadlineTimerJob,\
  io.casehub.work.runtime.strategy.RoutingCursorCleanupJob,\
  io.casehub.clinical.service.SponsorNotificationRetryJob,\
  io.casehub.clinical.cbr.SiteEnrollmentTrajectoryJob,\
  io.casehub.clinical.cbr.CbrRetentionPurgeJob,\
  io.casehub.clinical.cbr.CbrCompactionJob,\
  io.casehub.qhorus.runtime.channel.ClockProducer,\
  io.casehub.persistence.jpa.AbstractJpaRepository,\
  io.casehub.persistence.jpa.TenantAwareRepository,\
  io.casehub.persistence.jpa.JpaCaseMetaModelRepository,\
  io.casehub.persistence.jpa.JpaCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaPlanItemStore,\
  io.casehub.persistence.jpa.JpaSubCaseGroupRepository,\
  io.casehub.persistence.jpa.JpaEventLogRepository,\
  io.casehub.persistence.jpa.JpaCrossTenantCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaCrossTenantEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactiveCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaReactiveCaseMetaModelRepository,\
  io.casehub.persistence.jpa.JpaReactiveCrossTenantCaseInstanceRepository,\
  io.casehub.persistence.jpa.JpaReactiveCrossTenantEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactiveEventLogRepository,\
  io.casehub.persistence.jpa.JpaReactivePlanItemStore,\
  io.casehub.persistence.jpa.JpaReactiveSubCaseGroupRepository,\
  io.casehub.persistence.jpa.RlsPolicyApplicator,\
  io.casehub.qhorus.runtime.dashboard.QhorusDashboardService,\
  io.casehub.qhorus.runtime.api.ChannelResource,\
  io.casehub.platform.callback.LeaseReaper,\
  io.casehub.platform.callback.CallbackRegistrationResource,\
  io.casehub.engine.internal.callback.CallbackActionRiskClassifier,\
  io.casehub.engine.internal.callback.CallbackWorkerProvisionerDecorator

# In tests: use memory stores for engine PlanItem, SubCaseGroup, CaseMetaModel, and ledger persistence.
# InMemoryLedgerEntryRepository (casehub-ledger-memory) implements the full 2-arg LedgerEntryRepository
# API — selected here so JpaLedgerEntryRepository (which requires DB tables) is not activated.
# In production (application.properties): JPA stores are selected instead.
quarkus.arc.selected-alternatives=io.casehub.ledger.memory.InMemoryLedgerEntryRepository,\
  io.casehub.persistence.memory.InMemoryPlanItemStore,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryReactiveEventLogRepository,\
  io.casehub.persistence.memory.InMemoryReactivePlanItemStore,\
  io.casehub.persistence.memory.InMemoryReactiveSubCaseGroupRepository,\
  io.casehub.platform.memory.inmem.InMemoryMemoryStore,\
  io.casehub.platform.testing.FixedCurrentPrincipal,\
  io.casehub.neocortex.memory.cbr.inmem.InMemoryCbrCaseMemoryStore

